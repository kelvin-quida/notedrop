services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: notedrop_db
      POSTGRES_USER: notedrop_user
      POSTGRES_PASSWORD: notedrop_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notedrop_user -d notedrop_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-change-this-in-production
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,api
      - DB_NAME=notedrop_db
      - DB_USER=notedrop_user
      - DB_PASSWORD=notedrop_password
      - DB_HOST=db
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_EMAIL=admin@notedrop.com
      - DJANGO_SUPERUSER_PASSWORD=admin123
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "python manage.py makemigrations && python manage.py migrate && python manage.py create_default_superuser && python manage.py runserver 0.0.0.0:8000"

  web:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

  e2e:
    build: ./e2e
    network_mode: host
    environment:
      - BASE_URL=http://localhost:3000
      - API_URL=http://localhost:8000
    depends_on:
      - web
      - api
    volumes:
      - ./e2e:/e2e
      - /e2e/node_modules
    profiles:
      - testing
    command: npm test

volumes:
  postgres_data:
